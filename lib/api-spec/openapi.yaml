openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Supabase Auth operations
  - name: menu
    description: Public menu operations
  - name: orders
    description: Customer order operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/signup:
    post:
      operationId: signUp
      tags: [auth]
      summary: Create a customer account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid credentials or Supabase error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/login:
    post:
      operationId: logIn
      tags: [auth]
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logOut
      tags: [auth]
      summary: Sign out the current session
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Signed out
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/refresh:
    post:
      operationId: refreshSession
      tags: [auth]
      summary: Exchange a refresh token for a new session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New session issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Refresh token is invalid, expired or revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/me:
    get:
      operationId: getCurrentProfile
      tags: [auth]
      summary: Get the signed-in user's profile and role
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /categories:
    get:
      operationId: listCategories
      tags: [menu]
      summary: List menu categories
      responses:
        "200":
          description: Menu categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
  /products:
    get:
      operationId: listProducts
      tags: [menu]
      summary: List available products
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Available menu products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List the caller's orders
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Orders visible to the caller
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Place an order
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Invalid order, product unavailable or insufficient stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    AuthCredentials:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 6
      required:
        - email
        - password
    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_at:
          type: ["number", "null"]
        user:
          type: object
          properties:
            id:
              type: string
            email:
              type: ["string", "null"]
          required:
            - id
        profile:
          $ref: "#/components/schemas/Profile"
      required:
        - access_token
        - refresh_token
        - user
        - profile
    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
      required:
        - refresh_token
    Profile:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [customer, manager, admin]
      required:
        - id
        - email
        - role
    Category:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
      required:
        - id
        - name
        - slug
    Product:
      type: object
      properties:
        id:
          type: string
        category_id:
          type: string
        name:
          type: string
        price:
          type: number
        description:
          type: ["string", "null"]
        image_url:
          type: ["string", "null"]
        stock_count:
          type: number
        is_available:
          type: boolean
      required:
        - id
        - category_id
        - name
        - price
        - stock_count
        - is_available
    OrderItem:
      type: object
      properties:
        product_id:
          type: string
        name:
          type: string
        unit_price:
          type: number
        quantity:
          type: number
        line_total:
          type: number
      required:
        - product_id
        - name
        - unit_price
        - quantity
        - line_total
    Order:
      type: object
      properties:
        id:
          type: string
        customer_id:
          type: ["string", "null"]
        customer_name:
          type: string
        customer_phone:
          type: string
        delivery_address:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        total_price:
          type: number
        status:
          type: string
          enum: [pending, accepted, preparing, delivering, completed, rejected]
        created_at:
          type: ["string", "null"]
      required:
        - id
        - customer_name
        - customer_phone
        - delivery_address
        - items
        - total_price
        - status
    CreateOrderLine:
      type: object
      properties:
        product_id:
          type: string
        quantity:
          type: number
      required:
        - product_id
        - quantity
    CreateOrderRequest:
      type: object
      properties:
        customer_name:
          type: string
        customer_phone:
          type: string
        delivery_address:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/CreateOrderLine"
      required:
        - customer_name
        - customer_phone
        - delivery_address
        - items
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

